name: Build VidFFmpeg

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to test only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka
          python -m pip install -r requirements.txt

      - name: Build CLI
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=force `
            --windows-icon-from-ico=VidFFmpeg.ico `
            --output-dir=build `
            --output-filename=VidFFmpeg_CLI-win-x64.exe `
            VidFFmpeg_CLI.py

      - name: Build GUI
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=force `
            --windows-icon-from-ico=VidFFmpeg.ico `
            --enable-plugin=tk-inter `
            --include-package=tkinterdnd2 `
            --output-dir=build `
            --output-filename=VidFFmpeg_GUI-win-x64.exe `
            VidFFmpeg_GUI.py

      - name: Prepare CLI package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path release/VidFFmpeg_CLI-win-x64/profiles

          Copy-Item `
            -Recurse `
            build/VidFFmpeg_CLI.dist/* `
            release/VidFFmpeg_CLI-win-x64/

          Copy-Item `
            -Recurse `
            profiles/* `
            release/VidFFmpeg_CLI-win-x64/profiles/

      - name: Prepare GUI package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path release/VidFFmpeg_GUI-win-x64/profiles

          Copy-Item `
            -Recurse `
            build/VidFFmpeg_GUI.dist/* `
            release/VidFFmpeg_GUI-win-x64/

          Copy-Item `
            -Recurse `
            profiles/* `
            release/VidFFmpeg_GUI-win-x64/profiles/

          Copy-Item `
            VidFFmpeg.ico `
            release/VidFFmpeg_GUI-win-x64/

      - name: Create CLI ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/VidFFmpeg_CLI-win-x64 `
            -DestinationPath VidFFmpeg_CLI-win-x64.zip

      - name: Create GUI ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/VidFFmpeg_GUI-win-x64 `
            -DestinationPath VidFFmpeg_GUI-win-x64.zip

      - name: Show Windows packages
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "Windows packages"
          Write-Host "================================"

          Get-ChildItem *.zip | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            VidFFmpeg_CLI-win-x64.zip
            VidFFmpeg_GUI-win-x64.zip
          retention-days: 1


  linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-tk \
            patchelf \
            ccache

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka
          python -m pip install -r requirements.txt

      - name: Build CLI
        shell: bash
        run: |
          python -m nuitka \
            --mode=standalone \
            --assume-yes-for-downloads \
            --output-dir=build \
            --output-filename=VidFFmpeg_CLI-linux-x64 \
            VidFFmpeg_CLI.py

      - name: Build GUI
        shell: bash
        run: |
          python -m nuitka \
            --mode=standalone \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=tkinterdnd2 \
            --output-dir=build \
            --output-filename=VidFFmpeg_GUI-linux-x64 \
            VidFFmpeg_GUI.py

      - name: Prepare CLI package
        shell: bash
        run: |
          mkdir -p \
            release/VidFFmpeg_CLI-linux-x64/profiles

          cp -r \
            build/VidFFmpeg_CLI.dist/* \
            release/VidFFmpeg_CLI-linux-x64/

          cp -r \
            profiles/* \
            release/VidFFmpeg_CLI-linux-x64/profiles/

          chmod +x \
            release/VidFFmpeg_CLI-linux-x64/VidFFmpeg_CLI-linux-x64

      - name: Prepare GUI package
        shell: bash
        run: |
          mkdir -p \
            release/VidFFmpeg_GUI-linux-x64/profiles

          cp -r \
            build/VidFFmpeg_GUI.dist/* \
            release/VidFFmpeg_GUI-linux-x64/

          cp -r \
            profiles/* \
            release/VidFFmpeg_GUI-linux-x64/profiles/

          chmod +x \
            release/VidFFmpeg_GUI-linux-x64/VidFFmpeg_GUI-linux-x64

      - name: Create CLI TAR
        shell: bash
        run: |
          tar -czf \
            VidFFmpeg_CLI-linux-x64.tar.gz \
            -C release \
            VidFFmpeg_CLI-linux-x64

      - name: Create GUI TAR
        shell: bash
        run: |
          tar -czf \
            VidFFmpeg_GUI-linux-x64.tar.gz \
            -C release \
            VidFFmpeg_GUI-linux-x64

      - name: Show Linux packages
        shell: bash
        run: |
          echo "================================"
          echo "Linux packages"
          echo "================================"

          ls -lh *.tar.gz

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            VidFFmpeg_CLI-linux-x64.tar.gz
            VidFFmpeg_GUI-linux-x64.tar.gz
          retention-days: 1


  release:
    name: Release
    needs:
      - windows
      - linux

    if: ${{ github.event.inputs.version != '' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Download Linux release files
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release

      - name: Show release files
        shell: bash
        run: |
          echo "================================"
          echo "Release files"
          echo "================================"

          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: ""
          files: |
            release/VidFFmpeg_CLI-win-x64.zip
            release/VidFFmpeg_GUI-win-x64.zip
            release/VidFFmpeg_CLI-linux-x64.tar.gz
            release/VidFFmpeg_GUI-linux-x64.tar.gz
          generate_release_notes: false
