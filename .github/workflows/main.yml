name: Build VidFFmpeg

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to test only)"
        required: false
        default: ""

jobs:
  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          if (Test-Path "cli/requirements.txt") {
            python -m pip install -r cli/requirements.txt
          }

          if (Test-Path "gui/requirements.txt") {
            python -m pip install -r gui/requirements.txt
          }

      - name: Build CLI
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name VidFFmpeg_CLI-win-x64 `
            VidFFmpeg_CLI.py

      - name: Build GUI
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name VidFFmpeg_GUI-win-x64 `
            VidFFmpeg_GUI.py

      - name: Show build files
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "Windows build files"
          Write-Host "================================"

          Get-ChildItem dist | Format-Table Name, Length

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Copy-Item `
            dist/VidFFmpeg_CLI-win-x64.exe `
            release/

          Copy-Item `
            dist/VidFFmpeg_GUI-win-x64.exe `
            release/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release
          retention-days: 1


  linux:
    name: Linux Build
    runs-on: ubuntu-latest

    container:
      image: debian:11

    steps:
      - name: Install system packages
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 \
            python3-pip \
            python3-tk \
            gcc \
            git \
            binutils \
            ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

          if [ -f "requirements.txt" ]; then
            python3 -m pip install -r requirements.txt
          fi

          if [ -f "cli/requirements.txt" ]; then
            python3 -m pip install -r cli/requirements.txt
          fi

          if [ -f "gui/requirements.txt" ]; then
            python3 -m pip install -r gui/requirements.txt
          fi

      - name: Build CLI
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name VidFFmpeg_CLI-linux-x64 \
            VidFFmpeg_CLI.py

      - name: Build GUI
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name VidFFmpeg_GUI-linux-x64 \
            VidFFmpeg_GUI.py

      - name: Show build files
        shell: bash
        run: |
          echo "================================"
          echo "Linux build files"
          echo "================================"

          ls -lh dist

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release

          cp \
            dist/VidFFmpeg_CLI-linux-x64 \
            release/

          cp \
            dist/VidFFmpeg_GUI-linux-x64 \
            release/

          chmod +x release/VidFFmpeg_CLI-linux-x64
          chmod +x release/VidFFmpeg_GUI-linux-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release
          retention-days: 1


  release:
    name: Release
    needs:
      - windows
      - linux

    if: ${{ github.event.inputs.version != '' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows release file
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Download Linux release file
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release

      - name: Show release files
        shell: bash
        run: |
          echo "================================"
          echo "Release files"
          echo "================================"

          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: ""
          files: |
            release/VidFFmpeg_CLI-win-x64.exe
            release/VidFFmpeg_GUI-win-x64.exe
            release/VidFFmpeg_CLI-linux-x64
            release/VidFFmpeg_GUI-linux-x64
          generate_release_notes: false
